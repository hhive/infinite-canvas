<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="一个无限画布创作工具" />
        <link rel="icon" href="/logo.svg" />
        <title>无限画布</title>
        <script>
            var t = "light";
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                t = s.state && s.state.theme === "dark" ? "dark" : "light";
            } catch (e) {
                localStorage.setItem("infinite-canvas:theme_store", JSON.stringify({ state: { theme: "light" }, version: 0 }));
            }
            document.documentElement.classList.toggle("dark", t === "dark");
            document.documentElement.style.colorScheme = t;
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script src="/config.js"></script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
